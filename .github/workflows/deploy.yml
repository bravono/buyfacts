name: Deploy

on:
  push:
    branches:
      - master
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          username: ${{ github.ref == 'refs/heads/main' && secrets.PROD_USERNAME || secrets.STAGING_USERNAME }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Choose the correct directory and PM2 name based on the branch
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              PROJECT_DIR="/var/www/buyfacts"          # ← change if needed
              PM2_NAME="buyfacts"
              BRANCH="main"
            else
              PROJECT_DIR="/var/www/buyfacts-staging"  # ← change if needed
              PM2_NAME="buyfacts-staging"
              BRANCH="staging"
            fi

            echo "→ Deploying branch: $BRANCH"
            echo "→ Project directory: $PROJECT_DIR"

            cd $PROJECT_DIR

            echo "→ Pulling latest code..."
            git fetch origin $BRANCH
            git reset --hard origin/$BRANCH

            echo "→ Installing dependencies..."
            npm ci

            echo "→ Running Prisma migrations..."
            npx prisma migrate deploy

            echo "→ Building the application..."
            npm run build

            echo "→ Reloading PM2..."
            pm2 reload $PM2_NAME --update-env || pm2 start npm --name "$PM2_NAME" -- start

            echo "→ Deployment to $BRANCH completed successfully!"