<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 868" width="1580" height="868"><rect x="0" y="0" width="1580" height="868" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="790" y="47" font-size="38" font-weight="700" fill="#15335C" text-anchor="middle" >Traceable scoring: Elements to Category</text><rect x="530" y="80" width="520" height="76" rx="18" fill="#15335C" stroke="#15335C" stroke-width="2"/><text x="790" y="128" font-size="28" font-weight="700" fill="white" text-anchor="middle" >CATEGORY INDEX</text><line x1="790" y1="160" x2="410" y2="201" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="110" y="200" width="600" height="92" rx="18" fill="#E9F3FB" stroke="#CBDBE8" stroke-width="2"/><text x="410" y="232" font-size="24" font-weight="700" fill="#15335C" text-anchor="middle" >PERCEPTION AREA</text><text x="410" y="265" font-size="20" font-weight="600" fill="#1B679D" text-anchor="middle" >Area factor 0.55 × Area score</text><line x1="410" y1="295" x2="258" y2="314" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="110" y="316" width="292" height="95" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="256" y="352" font-size="21" font-weight="700" fill="#15335C" text-anchor="middle" >EMOTIVE</text><text x="256" y="389" font-size="19" font-weight="500" fill="#007F83" text-anchor="middle" >Group factor 0.40</text><rect x="118" y="430" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="255" y="459" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 1: pts × factor</text><rect x="118" y="491" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="255" y="520" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 2: pts × factor</text><rect x="118" y="552" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="255" y="581" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 3: pts × factor</text><rect x="118" y="613" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="255" y="642" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 4: pts × factor</text><line x1="410" y1="295" x2="568" y2="314" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="420" y="316" width="292" height="95" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="566" y="352" font-size="21" font-weight="700" fill="#15335C" text-anchor="middle" >PRACTICAL</text><text x="566" y="389" font-size="19" font-weight="500" fill="#007F83" text-anchor="middle" >Group factor 0.60</text><rect x="428" y="430" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="565" y="459" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 1: pts × factor</text><rect x="428" y="491" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="565" y="520" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 2: pts × factor</text><rect x="428" y="552" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="565" y="581" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 3: pts × factor</text><rect x="428" y="613" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="565" y="642" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 4: pts × factor</text><line x1="790" y1="160" x2="1170" y2="201" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="870" y="200" width="600" height="92" rx="18" fill="#E9F3FB" stroke="#CBDBE8" stroke-width="2"/><text x="1170" y="232" font-size="24" font-weight="700" fill="#15335C" text-anchor="middle" >EXPERIENCE AREA</text><text x="1170" y="265" font-size="20" font-weight="600" fill="#1B679D" text-anchor="middle" >Area factor 0.45 × Area score</text><line x1="1170" y1="295" x2="1018" y2="314" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="870" y="316" width="292" height="95" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="1016" y="352" font-size="21" font-weight="700" fill="#15335C" text-anchor="middle" >EMOTIVE</text><text x="1016" y="389" font-size="19" font-weight="500" fill="#007F83" text-anchor="middle" >Group factor 0.35</text><rect x="878" y="430" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1015" y="459" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 1: pts × factor</text><rect x="878" y="491" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1015" y="520" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 2: pts × factor</text><rect x="878" y="552" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1015" y="581" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 3: pts × factor</text><rect x="878" y="613" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1015" y="642" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 4: pts × factor</text><line x1="1170" y1="295" x2="1328" y2="314" stroke="#CBDBE8" stroke-width="3" stroke-dasharray=""/><rect x="1180" y="316" width="292" height="95" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="1326" y="352" font-size="21" font-weight="700" fill="#15335C" text-anchor="middle" >PRACTICAL</text><text x="1326" y="389" font-size="19" font-weight="500" fill="#007F83" text-anchor="middle" >Group factor 0.65</text><rect x="1188" y="430" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1325" y="459" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 1: pts × factor</text><rect x="1188" y="491" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1325" y="520" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 2: pts × factor</text><rect x="1188" y="552" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1325" y="581" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 3: pts × factor</text><rect x="1188" y="613" width="275" height="47" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="1325" y="642" font-size="18" font-weight="500" fill="#15335C" text-anchor="middle" >Driver 4: pts × factor</text><rect x="90" y="719" width="1400" height="116" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="790" y="755" font-size="22" font-weight="700" fill="#15335C" text-anchor="middle" >1. Group score = Σ (Element points × Driver factor) ÷ Σ Driver factors</text><text x="790" y="788" font-size="22" font-weight="700" fill="#15335C" text-anchor="middle" >2. Area score = (Emotive group × its share) + (Practical group × its share)</text><text x="790" y="820" font-size="20" font-weight="700" fill="#15335C" text-anchor="middle" >3. Category index = (Perception score × Area share) + (Experience score × Area share)</text></svg>