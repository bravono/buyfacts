<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 724" width="1480" height="724"><rect x="0" y="0" width="1480" height="724" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="740" y="48" font-size="36" font-weight="700" fill="#15335C" text-anchor="middle" >The same expert cohort, successive Affinity Waves</text><rect x="53" y="165" width="326" height="250" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="216" y="215" font-size="27" font-weight="700" fill="#1B679D" text-anchor="middle" >COHORT</text><text x="216" y="267" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >50 qualified</text><text x="216" y="299" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >participants</text><line x1="382" y1="292" x2="404" y2="292" stroke="#E88E1C" stroke-width="6" stroke-dasharray=""/><rect x="410" y="165" width="326" height="250" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="573" y="215" font-size="27" font-weight="700" fill="#1B679D" text-anchor="middle" >WINDOW</text><text x="573" y="267" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >7–14 day response</text><text x="573" y="299" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >window</text><line x1="739" y1="292" x2="761" y2="292" stroke="#E88E1C" stroke-width="6" stroke-dasharray=""/><rect x="767" y="165" width="326" height="250" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="930" y="215" font-size="27" font-weight="700" fill="#1B679D" text-anchor="middle" >WAVE</text><text x="930" y="267" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >16 TRIAD corner</text><text x="930" y="299" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >choices + weights</text><line x1="1096" y1="292" x2="1118" y2="292" stroke="#E88E1C" stroke-width="6" stroke-dasharray=""/><rect x="1124" y="165" width="326" height="250" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="1287" y="215" font-size="27" font-weight="700" fill="#1B679D" text-anchor="middle" >REVIEW</text><text x="1287" y="267" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >Change, variation,</text><text x="1287" y="299" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >driver context</text><rect x="105" y="485" width="1270" height="180" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="740" y="532" font-size="25" font-weight="700" fill="#15335C" text-anchor="middle" >Repeat the same instrument with the same eligible participants.</text><text x="740" y="575" font-size="21" font-weight="400" fill="#15335C" text-anchor="middle" >Keep one immutable record per participant, wave, TRIAD, selected corner and importance allocation.</text><text x="740" y="615" font-size="19" font-weight="400" fill="#64748B" text-anchor="middle" >A pilot simulates sign-in and submission; production must enforce identity, privacy and cohort permissions.</text></svg>