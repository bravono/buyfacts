<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 745" width="1360" height="745"><rect x="0" y="0" width="1360" height="745" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="680" y="52" font-size="36" font-weight="700" fill="#15335C" text-anchor="middle">TRIAD: one puck, three corner Elements</text><text x="680" y="91" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle">The puck starts centered. Only a corner selection is recorded; interior positions are not.</text><polygon points="340.00,258.23 520.00,570.00 160.00,570.00" fill="#FFF8EC" stroke="#15335C" stroke-width="5" stroke-linejoin="round"/><text x="153" y="602" font-size="21" font-weight="700" fill="#1B679D" text-anchor="end">33</text><text x="530" y="602" font-size="21" font-weight="700" fill="#1B679D" text-anchor="start">66</text><text x="340.0" y="248.23" font-size="21" font-weight="700" fill="#1B679D" text-anchor="middle">99</text><circle cx="340.00" cy="466.08" r="36.0" fill="#E88E1C" stroke="#FFFFFF" stroke-width="4"/><text x="340" y="175" font-size="22" font-weight="700" fill="#15335C" text-anchor="middle">ILLUSTRATIVE POSITIVE-APEX TRIAD</text><rect x="740" y="171" width="515" height="340" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="781" y="230" font-size="25" font-weight="700" fill="#15335C" text-anchor="start">THREE CORNER ELEMENTS</text><rect x="781" y="243" width="426" height="59" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="807" y="279" font-size="22" font-weight="600" fill="#15335C" text-anchor="start">Lower left</text><text x="1180" y="279" font-size="22" font-weight="700" fill="#1B679D" text-anchor="end">33 pts</text><rect x="781" y="320" width="426" height="59" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="807" y="356" font-size="22" font-weight="600" fill="#15335C" text-anchor="start">Lower right</text><text x="1180" y="356" font-size="22" font-weight="700" fill="#1B679D" text-anchor="end">66 pts</text><rect x="781" y="397" width="426" height="59" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="807" y="433" font-size="22" font-weight="600" fill="#15335C" text-anchor="start">Apex</text><text x="1180" y="433" font-size="22" font-weight="700" fill="#1B679D" text-anchor="end">99 pts</text><rect x="140" y="620" width="1080" height="89" rx="18" fill="#E9F3FB" stroke="#CBDBE8" stroke-width="2"/><text x="680" y="661" font-size="24" font-weight="700" fill="#15335C" text-anchor="middle">Choice = selected Element + its prescribed sentiment value</text><text x="680" y="691" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle">Successive selections from the same participant create comparable Affinity Wave data.</text></svg>