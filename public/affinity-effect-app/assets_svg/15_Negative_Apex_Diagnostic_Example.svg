<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 725" width="1360" height="725"><rect x="0" y="0" width="1360" height="725" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="680" y="47" font-size="34" font-weight="700" fill="#15335C" text-anchor="middle">Illustrative negative-apex interpretation</text><text x="680" y="91" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle">Diagnostic example: implementation concern (not an additional core Driver)</text><polygon points="340.00,255.21 505.00,541.00 175.00,541.00" fill="#FFF8EC" stroke="#15335C" stroke-width="5" stroke-linejoin="round"/><text x="168" y="573" font-size="21" font-weight="700" fill="#1B679D" text-anchor="end">99</text><text x="515" y="573" font-size="21" font-weight="700" fill="#1B679D" text-anchor="start">66</text><text x="340.0" y="245.21" font-size="21" font-weight="700" fill="#1B679D" text-anchor="middle">33</text><circle cx="340.00000" cy="329.41000" r="34.6" fill="#E88E1C"/><rect x="645" y="205" width="570" height="337" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="679" y="253" font-size="23" font-weight="700" fill="#15335C" text-anchor="start">LOWER LEFT 99: Minor concern</text><text x="679" y="325" font-size="23" font-weight="700" fill="#15335C" text-anchor="start">LOWER RIGHT 66: Moderate concern</text><text x="679" y="397" font-size="23" font-weight="700" fill="#B44B46" text-anchor="start">APEX 33: Severe concern</text><text x="676" y="457" font-size="21" font-weight="400" fill="#15335C" text-anchor="start">Toward the apex means more negative</text><text x="676" y="488" font-size="21" font-weight="400" fill="#15335C" text-anchor="start">sentiment, even as the puck visually moves</text><text x="676" y="519" font-size="21" font-weight="400" fill="#15335C" text-anchor="start">upward.</text><text x="680" y="679" font-size="24" font-weight="700" fill="#15335C" text-anchor="middle">Do not infer favorable direction from the shape alone.</text></svg>