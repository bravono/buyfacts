<!DOCTYPE html>
<html lang="en" style="background-color: #0f141c !important; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root, html, body, #root {
        background-color: #0f141c !important;
        background: #0f141c !important;
        color-scheme: dark !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        touch-action: none !important;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f141c !important;
        z-index: 99999;
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .loader-cube {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 8px;
        animation: spin-cube 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      }
      .loader-text {
        margin-top: 18px;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
      }
      @keyframes spin-cube {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      window.addEventListener('wheel', function(){}, { passive: true });
    </script>
    <link rel="icon" href="./assets/cubicon_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cubicon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script
      src="https://kit.fontawesome.com/ea5f6dcb80.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" crossorigin src="./assets/index-CJyhNAey.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-KPSNMo3V.css">
  </head>
  <body style="background-color: #0f141c; margin: 0; padding: 0;">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-cube"></div>
        <div class="loader-text">Initializing 3D Cubicon Engine...</div>
      </div>
    </div>
  </body>
</html>
