<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 786" width="1500" height="786"><rect x="0" y="0" width="1500" height="786" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="750" y="55" font-size="42" font-weight="700" fill="#15335C" text-anchor="middle">Positive-apex Affinity Wave</text><text x="750" y="95" font-size="23" font-weight="400" fill="#64748B" text-anchor="middle">Higher sentiment points indicate more favorable selection.</text><polygon points="275.00,238.81 390.00,438.00 160.00,438.00" fill="#FFF8EC" stroke="#15335C" stroke-width="5" stroke-linejoin="round"/><text x="153" y="470" font-size="21" font-weight="700" fill="#1B679D" text-anchor="end">33</text><text x="400" y="470" font-size="21" font-weight="700" fill="#1B679D" text-anchor="start">66</text><text x="275.0" y="228.81" font-size="21" font-weight="700" fill="#1B679D" text-anchor="middle">99</text><circle cx="207.63115" cy="410.49957" r="25.0" fill="#E88E1C"/><text x="275" y="178" font-size="26" font-weight="700" fill="#15335C" text-anchor="middle">WAVE 1</text><rect x="150" y="493" width="256" height="83" rx="18" fill="#E9F3FB" stroke="#CBDBE8" stroke-width="2"/><text x="276" y="526" font-size="20" font-weight="700" fill="#15335C" text-anchor="middle">Lower left</text><text x="276" y="559" font-size="19" font-weight="500" fill="#15335C" text-anchor="middle">33 sentiment points</text><line x1="427" y1="320" x2="550" y2="320" stroke="#E88E1C" stroke-width="7" stroke-dasharray=""/><polygon points="565,320 543,308 543,332" fill="#E88E1C"/><polygon points="718.00,238.81 833.00,438.00 603.00,438.00" fill="#FFF8EC" stroke="#15335C" stroke-width="5" stroke-linejoin="round"/><text x="596" y="470" font-size="21" font-weight="700" fill="#1B679D" text-anchor="end">33</text><text x="843" y="470" font-size="21" font-weight="700" fill="#1B679D" text-anchor="start">66</text><text x="718.0" y="228.81" font-size="21" font-weight="700" fill="#1B67