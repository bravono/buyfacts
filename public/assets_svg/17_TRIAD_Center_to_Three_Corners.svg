<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 790" width="1360" height="790">
<rect width="1360" height="790" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1C6D9A"/></marker></defs>
<text x="680" y="57" text-anchor="middle" font-size="37" font-weight="700" fill="#15335C">From the center to one of three Elements</text>
<text x="680" y="101" text-anchor="middle" font-size="21" fill="#64748B">The puck starts centered. A participant chooses exactly one corner.</text>
<polygon points="355,250.570601 170,571 540,571" stroke="#15335C" stroke-width="7" fill="#FFF8EC" stroke-linejoin="round"/>
<line x1="355" y1="464.190200" x2="355.00" y2="333.57" stroke="#1C6D9A" stroke-width="6" stroke-dasharray="11 8" marker-end="url(#arr)"/>
<line x1="355" y1="464.190200" x2="241.88" y2="529.50" stroke="#1C6D9A" stroke-width="6" stroke-dasharray="11 8" marker-end="url(#arr)"/>
<line x1="355" y1="464.190200" x2="468.12" y2="529.50" stroke="#1C6D9A" stroke-width="6" stroke-dasharray="11 8" marker-end="url(#arr)"/>
<circle cx="355" cy="464.190200" r="39" fill="#E88E1C" stroke="white" stroke-width="6"/>
<circle cx="355.0000" cy="302.5706" r="20" fill="#E9F3FB" stroke="#1C6D9A" stroke-width="5"/>
<circle cx="215.0333" cy="545.0000" r="20" fill="#E9F3FB" stroke="#1C6D9A" stroke-width="5"/>
<circle cx="494.9667" cy="545.0000" r="20" fill="#E9F3FB" stroke="#1C6D9A" stroke-width="5"/>
<text x="355" y="208" font-size="25" text-anchor="middle" fill="#15335C" font-weight="700">Apex · 99</text>
<text x="170" y="620" font-size="23" text-anchor="middle" fill="#15335C" font-weight="700">Lower left · 33</text>
<text x="540" y="620" font-size="23" text-anchor="middle" fill="#15335C" font-weight="700">Lower right · 66</text>
<text x="750" y="262" font-size="29" font-weight="700" fill="#15335C">How it works</text>
<text x="750" y="318" font-size="25" fill="#15335C">1. The puck appears at the center.</text>
<text x="750" y="380" font-size="25" fill="#15335C">2. Move it to one corner Element.</text>
<text x="750" y="442" font-size="25" fill="#15335C">3. Submit that corner selection.</text>
<text x="750" y="517" font-size="22" fill="#1C6D9A">The system records the selected corner</text>
<text x="750" y="551" font-size="22" fill="#1C6D9A">and its prescribed sentiment points.</text>
<rect x="113" y="679" width="1135" height="72" rx="16" fill="#E9F3FB"/>
<text x="680" y="723" font-size="23" text-anchor="middle" fill="#15335C" font-weight="700">The center is a starting position, not a recorded sentiment choice.</text>
</svg>