<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 812" width="1480" height="812"><rect x="0" y="0" width="1480" height="812" fill="#FFFFFF"/><style>text{font-family:Roboto,Arial,sans-serif;} .dash{stroke-dasharray:6 8}</style><text x="740" y="47" font-size="37" font-weight="700" fill="#15335C" text-anchor="middle" >Two importance scales with different rules</text><rect x="58" y="95" width="660" height="540" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><rect x="760" y="95" width="662" height="540" rx="18" fill="#F4F7FA" stroke="#CBDBE8" stroke-width="2"/><text x="388" y="146" font-size="29" font-weight="700" fill="#1B679D" text-anchor="middle" >DRIVER IMPORTANCE</text><text x="1091" y="146" font-size="29" font-weight="700" fill="#007F83" text-anchor="middle" >GROUP / AREA SHARE</text><text x="104" y="185" font-size="23" font-weight="400" fill="#15335C" text-anchor="start" >Each Driver is rated independently from 1 to 100.</text><text x="104" y="283" font-size="21" font-weight="600" fill="#15335C" text-anchor="start" >Driver A</text><rect x="250" y="252" width="164" height="46" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="332" y="283" font-size="24" font-weight="700" fill="#1B679D" text-anchor="middle" >80</text><text x="475" y="283" font-size="23" font-weight="600" fill="#15335C" text-anchor="start" >× 0.01 = 0.80</text><text x="104" y="358" font-size="21" font-weight="600" fill="#15335C" text-anchor="start" >Driver B</text><rect x="250" y="327" width="164" height="46" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="332" y="358" font-size="24" font-weight="700" fill="#1B679D" text-anchor="middle" >90</text><text x="475" y="358" font-size="23" font-weight="600" fill="#15335C" text-anchor="start" >× 0.01 = 0.90</text><text x="104" y="433" font-size="21" font-weight="600" fill="#15335C" text-anchor="start" >Driver C</text><rect x="250" y="402" width="164" height="46" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="332" y="433" font-size="24" font-weight="700" fill="#1B679D" text-anchor="middle" >75</text><text x="475" y="433" font-size="23" font-weight="600" fill="#15335C" text-anchor="start" >× 0.01 = 0.75</text><text x="104" y="508" font-size="21" font-weight="600" fill="#15335C" text-anchor="start" >Driver D</text><rect x="250" y="477" width="164" height="46" rx="18" fill="white" stroke="#CBDBE8" stroke-width="2"/><text x="332" y="508" font-size="24" font-weight="700" fill="#1B679D" text-anchor="middle" >85</text><text x="475" y="508" font-size="23" font-weight="600" fill="#15335C" text-anchor="start" >× 0.01 = 0.85</text><text x="389" y="598" font-size="22" font-weight="700" fill="#1B679D" text-anchor="middle" >Factor totals may exceed 1.00.</text><text x="805" y="185" font-size="23" font-weight="400" fill="#15335C" text-anchor="start" >Distribute 100 points within each paired group.</text><text x="808" y="285" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Perception emotive</text><text x="1195" y="285" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >40 to 0.40</text><text x="808" y="338" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Perception practical</text><text x="1195" y="338" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >60 to 0.60</text><text x="808" y="391" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Experience emotive</text><text x="1195" y="391" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >35 to 0.35</text><text x="808" y="444" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Experience practical</text><text x="1195" y="444" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >65 to 0.65</text><text x="808" y="497" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Perception Area</text><text x="1195" y="497" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >55 to 0.55</text><text x="808" y="550" font-size="19" font-weight="600" fill="#15335C" text-anchor="start" >Experience Area</text><text x="1195" y="550" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >45 to 0.45</text><text x="1092" y="615" font-size="21" font-weight="700" fill="#007F83" text-anchor="middle" >Each paired allocation sums to 100.</text><rect x="92" y="687" width="1290" height="90" rx="18" fill="#E9F3FB" stroke="#CBDBE8" stroke-width="2"/><text x="736" y="731" font-size="25" font-weight="700" fill="#15335C" text-anchor="middle" >Driver factor × selected Element points = weighted Driver value</text><text x="736" y="763" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle" >Then normalize within each group, apply group shares, and combine Area sub-scores.</text></svg>