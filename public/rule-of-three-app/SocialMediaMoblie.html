<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile UI Layout</title>
    <style>
        /* Reset & base */
        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Roboto, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Raleway, sans-serif;
            background: #f0f0f0;
        }

        /* Main container */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: 0 auto;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Corner logo */
        .corner-logo {
            position: absolute;
            top: 0px;
            right: 0px;
            width: 40px;
            height: 40px;
        }

        /* Header grid: left 3 rows, right 2 rows */
        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto;
        }

        .header-grid .cell {
            padding: 12px 16px;
            border-bottom: 1px solid #06507B;
            font-size: 16px;
            font-weight: normal;
            color: #fff;
        }

        .header-grid .left {
            border-right: 1px solid #06507B;
        }

        .left.row1 {
            grid-column: 1;
            grid-row: 1;
        }

        .left.row2 {
            grid-column: 1;
            grid-row: 2;
        }

        .left.row3 {
            grid-column: 1;
            grid-row: 3;
        }

        .right.row12 {
            grid-column: 2;
            grid-row: 1 / span 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: #fff;
        }

        .right.row3 {
            grid-column: 2;
            grid-row: 3;
            text-align: right;
            color: #fff;
        }

        /* Icon rows: full width */
        .row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #06507B;
        }

        .row .col1 {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .row img.icon {
            width: 15px;
            height: 15px;
            margin-right: 8px;
            vertical-align: middle;

        }

        .row .col1 .text {
            font-weight: bold;
            white-space: normal;
            font-size: 20px;
            color: #fff;
        }

        /* Control panel */
        .control-panel {
            position: relative;
            background: #FBB040;
            padding: 24px 16px 12px;
        }

        .control-panel .status {
            position: absolute;
            top: 0;
            left: 16px;
            transform: translateY(-50%);
            background: #fff;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            font-weight: lighter;
        }

        /* Button grid */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .button-grid button {
            width: 100%;
            padding: 8px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-logo img {
            /* adjust height to taste */
            height: 40px;
            width: auto;
        }

        .footer-text {
            display: flex;
            flex-direction: column;
            font-size: 10px;
            color: #00527C;
            gap: 2px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Upper-corner logo -->
        <img src="./assets/r3-top.svg" alt="3" class="corner-logo">

        <!-- Header grid -->
        <div class="header-grid">
            <div class="cell left row1">SOCIAL MEDIA (An Approach Rule)</div>
            <div class="cell right row12">Takeaway Value</div>
            <div class="cell left row2">Principle Best Practices</div>
            <div class="cell right row3">Conversations Build Conversions</div>
            <div class="cell left row3">As the saying goes...</div>
        </div>

        <!-- Icon/text rows -->
        <div class="row">
            <div class="col1">
                <img src="./assets/BuyFactsLogoBulleSquare.svg" alt="Icon" class="icon">
                <span class="text">Post helpful tips</span>
            </div>
        </div>
        <div class="row">
            <div class="col1">
                <img src="./assets/BuyFactsLogoBulleSquare.svg" alt="Icon" class="icon">
                <span class="text">Respond to FAQs</span>
            </div>
        </div>
        <div class="row">
            <div class="col1">
                <img src="./assets/BuyFactsLogoBulleSquare.svg" alt="Icon" class="icon">
                <span class="text">Curate relevant content</span>
            </div>
        </div>

        <!-- Control panel -->
        <div class="control-panel">
            <div class="status">You are at: Level Two</div>
            <div class="button-grid">
                <button class="Level_One">LEVEL ONE</button>
                <button class="Previous_Principle">PREVIOUS PRINCIPLE</button>
                <button class="Next_Principle">NEXT PRINCIPLE</button>
                <button class="Rule_Summary">RULE SUMMARY</button>
                <button class="Rule_List">RULE LIST</button>
                <button class="Exit">EXIT</button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-logo">
                <img src="./assets/LogoName.svg" alt="BuyFacts Logo">
            </div>
            <div class="footer-text">
                <span class="footer-line">REAL DATA – REAL PEOPLE</span>
                <span class="footer-line">https://www.buyfacts.com</span>
            </div>
        </footer>

    </div>
</body>

</html>
